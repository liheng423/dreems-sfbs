# Map and POI sampling settings. File locations live in output_adapters.py.

[poi_tags]
amenity = ["arts_centre", "bank", "bar", "cafe", "childcare", "cinema", "clinic", "college", "community_centre", "courthouse", "dentist", "doctors", "fast_food", "hospital", "kindergarten", "library", "marketplace", "nursing_home", "pharmacy", "place_of_worship", "police", "post_office", "pub", "restaurant", "school", "social_facility", "theatre", "townhall", "university"]
building = ["commercial", "hotel", "office", "retail", "stadium", "supermarket", "train_station"]
leisure = ["fitness_centre", "park", "pitch", "playground", "sports_centre", "stadium", "swimming_pool"]
healthcare = ["clinic", "dentist", "doctor", "hospital", "laboratory", "pharmacy", "physiotherapist"]
historic = ["archaeological_site", "castle", "church", "fort", "monument"]
office = true
railway = ["halt", "station", "tram_stop"]
shop = true
tourism = ["apartment", "artwork", "attraction", "camp_site", "caravan_site", "chalet", "gallery", "guest_house", "hostel", "hotel", "museum", "picnic_site", "viewpoint", "zoo"]

[method_pois]
rows = 50
columns = 50

[locations]
depot = { "name" = "Depot Sales-Lentz Bascharage", "lat" = 49.568613, "lon" = 5.922762 }

