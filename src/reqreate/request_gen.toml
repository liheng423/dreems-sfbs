# REQreate demand settings. Clock times are relative to one service day.
# Distribution parameters: uniform loc is the minimum and scale is the range width;
# normal loc is the mean and scale is the standard deviation.
seed = 42
# Retry rejected requests until the sampled candidate count is retained.
retry_if_filtered = true

[simulation]
start = "08:00:00"
end = "12:00:00"
demand_start = "08:00:00"

# See README.md for details on the definitions of the following parameters.
# Dynamic order placement times follow a Poisson process over simulation.start..end.
# Prebooked earliest_departure times independently follow a Poisson process over
# simulation.demand_start..end; their order placement times are departure minus lead time.
# Lead times are in seconds. Interval between the time order is placed and the desired pickup time.
# radial_distance samples the distance from the POI-zone endpoint to the other endpoint.
# radial_direction samples that endpoint's bearing clockwise from north: 0° north, 90° east.
# loc is the first degree and scale is the clockwise range; loc=0, scale=360 allows every direction.
[distributions]
dynamic_order_place_time = { type = "poisson", rate_per_hour = 12.5 }
prebooked_earliest_departure = { type = "poisson", rate_per_hour = 12.5 }
# TODO: check if what is the minimum lead time for dynamic requests.
lt_dynamic = { type = "uniform", loc = 300, scale = 1500 } # lead time for dynamic requests
lt_prebooked = { type = "uniform", loc = 36000, scale = 72000 }
radial_distance = { type = "uniform", loc = 500, scale = 14500 }          # [m]
radial_direction = { type = "uniform", loc = 0, scale = 360 }
pickup_timewindow = { type = "uniform", loc = 900, scale = 0 }            # 15 min
dropoff_timewindow = { type = "uniform", loc = 900, scale = 0 }           # 15 min
service_time = { type = "uniform", loc = 30, scale = 0 }                  # fixed to 30 seconds
