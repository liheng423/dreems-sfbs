# Route 550 REQreate area-demand settings. Paths are relative to the repository root.
# Distribution parameters: uniform loc is the minimum and scale is the range width;
# normal loc is the mean and scale is the standard deviation.
seed = 42
requests = 20000
service_area_path = "data/reqreate/service_area_550/service_area.geojson"
stops_path = "data/busline/stops_550.json"
output_dir = "data/reqreate/area_550"
poi_cache_file = "550_pois.json"
pool_file = "550_raw_requests.json"
metadata_file = "550_raw_requests_metadata.json"

[poi_tags]
amenity = ["arts_centre", "bar", "cafe", "cinema", "clinic", "college", "community_centre", "dentist", "doctors", "fast_food", "hospital", "kindergarten", "library", "marketplace", "nursing_home", "pub", "restaurant", "school", "social_facility", "theatre", "townhall", "university"]
building = ["commercial", "hotel", "office", "retail", "stadium", "supermarket", "train_station"]
leisure = ["fitness_centre", "park", "sports_centre", "stadium", "swimming_pool"]
office = true
shop = true
tourism = ["attraction", "gallery", "hotel", "museum", "zoo"]

[method_pois]
locations = ["origin", "destination"]
rows = 50
columns = 50

[method_pois.pdf]
type = "uniform"
loc = 500
scale = 14500

[[parameters]]
name = "min_early_departure"
type = "integer"
value = 17100
time_unit = "s"

[[parameters]]
name = "max_early_departure"
type = "integer"
value = 86510
time_unit = "s"

[[attributes]]
name = "is_prebooked"
type = "integer"
output_csv = true

[[attributes.pdf]]
type = "uniform"
loc = 0
scale = 1

[[attributes]]
name = "lt_dynamic"
type = "integer"
time_unit = "s"
output_csv = false

[[attributes.pdf]]
type = "uniform"
loc = 300
scale = 1500

[[attributes]]
name = "lt_prebooked"
type = "integer"
time_unit = "s"
output_csv = false

[[attributes.pdf]]
type = "uniform"
loc = 86400
scale = 172800

[[attributes]]
name = "lead_time"
type = "integer"
time_unit = "s"
expression = "lt_prebooked if is_prebooked >= 0.5 else lt_dynamic"

[[attributes]]
name = "earliest_departure"
type = "integer"
time_unit = "s"
constraints = ["earliest_departure >= min_early_departure", "earliest_departure <= max_early_departure"]

[[attributes.pdf]]
type = "normal"
loc = 51805
scale = 11568

[[attributes]]
name = "time_stamp"
type = "integer"
time_unit = "s"
expression = "earliest_departure - lead_time"

[[attributes]]
name = "origin"
type = "location"

[[attributes]]
name = "destination"
type = "location"

[[attributes]]
name = "direct_distance"
type = "integer"
length_unit = "m"
expression = "dist_drive(origin,destination)"
constraints = ["direct_distance >= min_distance"]
output_csv = true

[[attributes]]
name = "direct_travel_time"
type = "integer"
time_unit = "s"
expression = "dtt(origin,destination)"
constraints = ["direct_travel_time > 0"]

[[attributes]]
name = "latest_arrival"
type = "integer"
time_unit = "s"
expression = "earliest_departure + direct_travel_time + 600"
